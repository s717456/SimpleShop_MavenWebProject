<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>訂單管理 - SimpleShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">SimpleShop</a>
        <a class="btn btn-outline-light btn-sm" href="../logout">登出</a>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>訂單 CRUD</h2>
        <a href="../index.html" class="btn btn-secondary">回首頁</a>
    </div>

    <div class="card mb-4">
        <div class="card-header">新增訂單</div>
        <div class="card-body">
            <form id="orderForm">
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label">會員</label>
                        <select class="form-select" name="memberId" required></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">員工編號</label>
                        <input class="form-control" name="employeeNo" placeholder="可空白">
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered align-middle">
                        <thead class="table-light">
                        <tr><th>商品</th><th style="width: 160px">數量</th><th style="width: 120px">操作</th></tr>
                        </thead>
                        <tbody id="itemRows"></tbody>
                    </table>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-outline-primary" type="button" id="addItemBtn">增加品項</button>
                    <button class="btn btn-warning" type="submit">建立訂單</button>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th>ID</th><th>訂單編號</th><th>會員</th><th>總金額</th><th>狀態</th><th>品項</th><th>操作</th>
        </tr>
        </thead>
        <tbody id="orderTable"></tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../assets/js/common.js"></script>
<script>
    const orderApi = '../api/orders';
    const memberApi = '../api/members';
    const productApi = '../api/products';
    let products = [];

    function productOptions() {
        return products
            .filter(p => p.status === 'ACTIVE')
            .map(p => `<option value="${p.id}">${escapeHtml(p.productNo)} - ${escapeHtml(p.name)}（庫存 ${p.stock}，$${money(p.price)}）</option>`)
            .join('');
    }

    function addItemRow() {
        $('#itemRows').append(`
            <tr>
                <td><select class="form-select product-select" required>${productOptions()}</select></td>
                <td><input class="form-control quantity-input" type="number" min="1" step="1" value="1" required></td>
                <td><button class="btn btn-sm btn-outline-danger" type="button" onclick="$(this).closest('tr').remove()">移除</button></td>
            </tr>
        `);
    }

    function loadMembersAndProducts() {
        $.when($.getJSON(memberApi), $.getJSON(productApi)).done(function (memberRes, productRes) {
            const members = memberRes[0];
            products = productRes[0];
            $('[name=memberId]').html(members
                .filter(m => m.status === 'ACTIVE')
                .map(m => `<option value="${m.id}">${escapeHtml(m.name)}（${escapeHtml(m.username)}）</option>`)
                .join(''));
            $('#itemRows').empty();
            addItemRow();
        }).fail(ajaxError);
    }

    function loadOrders() {
        $.getJSON(orderApi, function (list) {
            $('#orderTable').html(list.map(o => `
                <tr>
                    <td>${o.id}</td>
                    <td>${escapeHtml(o.orderNo)}</td>
                    <td>${escapeHtml(o.memberName)}</td>
                    <td>${money(o.totalAmount)}</td>
                    <td>
                        <select class="form-select form-select-sm" onchange="updateStatus(${o.id}, this.value)">
                            ${['NEW', 'PAID', 'SHIPPED', 'CANCELLED'].map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                        </select>
                    </td>
                    <td>${(o.items || []).map(i => `${escapeHtml(i.productName)} x ${i.quantity}`).join('<br>')}</td>
                    <td><button class="btn btn-sm btn-danger" onclick="deleteOrder(${o.id})">刪除</button></td>
                </tr>
            `).join(''));
        }).fail(ajaxError);
    }

    function updateStatus(id, status) {
        $.ajax({
            url: `${orderApi}/${id}/status`,
            method: 'PUT',
            contentType: 'application/json',
            data: JSON.stringify({status}),
            success: loadOrders,
            error: ajaxError
        });
    }

    function deleteOrder(id) {
        if (!confirm('確定刪除？注意：此範例刪除訂單不會自動補回庫存。')) return;
        $.ajax({url: `${orderApi}/${id}`, method: 'DELETE', success: loadOrders, error: ajaxError});
    }

    $('#addItemBtn').on('click', addItemRow);

    $('#orderForm').on('submit', function (e) {
        e.preventDefault();
        const items = $('#itemRows tr').map(function () {
            return {
                productId: Number($(this).find('.product-select').val()),
                quantity: Number($(this).find('.quantity-input').val())
            };
        }).get();

        const data = {
            memberId: Number($('[name=memberId]').val()),
            employeeNo: $('[name=employeeNo]').val(),
            items
        };

        $.ajax({
            url: orderApi,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function () {
                $('#orderForm')[0].reset();
                loadMembersAndProducts();
                loadOrders();
            },
            error: ajaxError
        });
    });

    loadMembersAndProducts();
    loadOrders();
</script>
</body>
</html>
