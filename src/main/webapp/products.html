<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>商品管理 - SimpleShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">SimpleShop</a>
        <a class="btn btn-outline-light btn-sm" href="../logout">登出</a>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>商品 CRUD</h2>
        <a href="../index.html" class="btn btn-secondary">回首頁</a>
    </div>

    <div class="card mb-4">
        <div class="card-header">新增 / 修改商品</div>
        <div class="card-body">
            <form id="productForm" class="row g-3">
                <input type="hidden" name="id">
                <div class="col-md-2"><input class="form-control" name="productNo" placeholder="商品編號" required></div>
                <div class="col-md-3"><input class="form-control" name="name" placeholder="商品名稱" required></div>
                <div class="col-md-2"><input class="form-control" type="number" min="0" step="0.01" name="price" placeholder="價格" required></div>
                <div class="col-md-2"><input class="form-control" type="number" min="0" step="1" name="stock" placeholder="庫存" required></div>
                <div class="col-md-2">
                    <select class="form-select" name="status">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                    </select>
                </div>
                <div class="col-md-1 d-grid"><button class="btn btn-primary" type="submit">儲存</button></div>
                <div class="col-md-1 d-grid"><button class="btn btn-outline-secondary" type="button" id="resetBtn">清除</button></div>
            </form>
        </div>
    </div>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th>ID</th><th>商品編號</th><th>名稱</th><th>價格</th><th>庫存</th><th>狀態</th><th>操作</th>
        </tr>
        </thead>
        <tbody id="productTable"></tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../assets/js/common.js"></script>
<script>
    const api = '../api/products';

    function loadProducts() {
        $.getJSON(api, function (list) {
            $('#productTable').html(list.map(p => `
                <tr>
                    <td>${p.id}</td>
                    <td>${escapeHtml(p.productNo)}</td>
                    <td>${escapeHtml(p.name)}</td>
                    <td>${money(p.price)}</td>
                    <td>${p.stock}</td>
                    <td>${escapeHtml(p.status)}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick='editProduct(${JSON.stringify(p)})'>編輯</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">刪除</button>
                    </td>
                </tr>
            `).join(''));
        }).fail(ajaxError);
    }

    function editProduct(p) {
        const form = document.getElementById('productForm');
        form.id.value = p.id;
        form.productNo.value = p.productNo || '';
        form.name.value = p.name || '';
        form.price.value = p.price || 0;
        form.stock.value = p.stock || 0;
        form.status.value = p.status || 'ACTIVE';
    }

    function deleteProduct(id) {
        if (!confirm('確定刪除？')) return;
        $.ajax({url: `${api}/${id}`, method: 'DELETE', success: loadProducts, error: ajaxError});
    }

    $('#productForm').on('submit', function (e) {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(this).entries());
        const id = data.id;
        delete data.id;
        data.price = Number(data.price);
        data.stock = Number(data.stock);
        const method = id ? 'PUT' : 'POST';
        const url = id ? `${api}/${id}` : api;
        $.ajax({
            url,
            method,
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function () {
                $('#productForm')[0].reset();
                loadProducts();
            },
            error: ajaxError
        });
    });

    $('#resetBtn').on('click', function () {
        $('#productForm')[0].reset();
        $('#productForm [name=id]').val('');
    });

    loadProducts();
</script>
</body>
</html>
