<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>會員管理 - SimpleShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">SimpleShop</a>
        <a class="btn btn-outline-light btn-sm" href="../logout">登出</a>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>會員 CRUD</h2>
        <a href="../index.html" class="btn btn-secondary">回首頁</a>
    </div>

    <div class="card mb-4">
        <div class="card-header">新增 / 修改會員</div>
        <div class="card-body">
            <form id="memberForm" class="row g-3">
                <input type="hidden" name="id">
                <div class="col-md-3"><input class="form-control" name="name" placeholder="姓名" required></div>
                <div class="col-md-3"><input class="form-control" name="username" placeholder="帳號" required></div>
                <div class="col-md-3"><input class="form-control" type="password" name="password" placeholder="密碼（修改可空白）"></div>
                <div class="col-md-3"><input class="form-control" type="email" name="email" placeholder="Email"></div>
                <div class="col-md-3"><input class="form-control" name="phone" placeholder="電話"></div>
                <div class="col-md-3"><input class="form-control" name="address" placeholder="地址"></div>
                <div class="col-md-2">
                    <select class="form-select" name="role">
                        <option value="USER">USER</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select class="form-select" name="status">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                    </select>
                </div>
                <div class="col-md-2 d-grid"><button class="btn btn-primary" type="submit">儲存</button></div>
                <div class="col-md-2 d-grid"><button class="btn btn-outline-secondary" type="button" id="resetBtn">清除</button></div>
            </form>
        </div>
    </div>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th>ID</th><th>姓名</th><th>帳號</th><th>Email</th><th>電話</th><th>角色</th><th>狀態</th><th>操作</th>
        </tr>
        </thead>
        <tbody id="memberTable"></tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../assets/js/common.js"></script>
<script>
    const api = '../api/members';

    function loadMembers() {
        $.getJSON(api, function (list) {
            $('#memberTable').html(list.map(m => `
                <tr>
                    <td>${m.id}</td>
                    <td>${escapeHtml(m.name)}</td>
                    <td>${escapeHtml(m.username)}</td>
                    <td>${escapeHtml(m.email)}</td>
                    <td>${escapeHtml(m.phone)}</td>
                    <td>${escapeHtml(m.role)}</td>
                    <td>${escapeHtml(m.status)}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick='editMember(${JSON.stringify(m)})'>編輯</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteMember(${m.id})">刪除</button>
                    </td>
                </tr>
            `).join(''));
        }).fail(ajaxError);
    }

    function editMember(m) {
        const form = document.getElementById('memberForm');
        form.id.value = m.id;
        form.name.value = m.name || '';
        form.username.value = m.username || '';
        form.password.value = '';
        form.email.value = m.email || '';
        form.phone.value = m.phone || '';
        form.address.value = m.address || '';
        form.role.value = m.role || 'USER';
        form.status.value = m.status || 'ACTIVE';
    }

    function deleteMember(id) {
        if (!confirm('確定刪除？')) return;
        $.ajax({url: `${api}/${id}`, method: 'DELETE', success: loadMembers, error: ajaxError});
    }

    $('#memberForm').on('submit', function (e) {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(this).entries());
        const id = data.id;
        delete data.id;
        const method = id ? 'PUT' : 'POST';
        const url = id ? `${api}/${id}` : api;
        $.ajax({
            url,
            method,
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function () {
                $('#memberForm')[0].reset();
                loadMembers();
            },
            error: ajaxError
        });
    });

    $('#resetBtn').on('click', function () {
        $('#memberForm')[0].reset();
        $('#memberForm [name=id]').val('');
    });

    loadMembers();
</script>
</body>
</html>
